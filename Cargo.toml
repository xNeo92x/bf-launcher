[package]
name = "bf-launcher"
version = "0.2.0"
edition = "2024"
description = "Linux launcher for Battlefield 3 & 4 (EA app via Proton/umu + Battlelog server browser with real player counts)"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tao = "0.35"
toml = "0.9"
ureq = "3"
urlencoding = "2"
wry = "0.55"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
